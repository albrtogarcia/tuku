name: Test Builds

on:
  push:
    branches:
      - develop
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  parse-platforms:
    runs-on: ubuntu-latest
    outputs:
      run-linux: ${{ steps.parse.outputs.run-linux }}
      run-win: ${{ steps.parse.outputs.run-win }}
      run-mac: ${{ steps.parse.outputs.run-mac }}
    steps:
      - name: Parse platform filter from commit message
        id: parse
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          MATCH=$(echo "$MESSAGE" | grep -oP '\[[^\]]*\]' | head -1 | tr -d '[]' | tr ',' ' ')

          if [ -z "$MATCH" ]; then
            echo "run-linux=true" >> $GITHUB_OUTPUT
            echo "run-win=true"   >> $GITHUB_OUTPUT
            echo "run-mac=true"   >> $GITHUB_OUTPUT
          else
            echo "$MATCH" | grep -qw "linux" && echo "run-linux=true" >> $GITHUB_OUTPUT || echo "run-linux=false" >> $GITHUB_OUTPUT
            echo "$MATCH" | grep -qw "win"   && echo "run-win=true"   >> $GITHUB_OUTPUT || echo "run-win=false"   >> $GITHUB_OUTPUT
            echo "$MATCH" | grep -qw "mac"   && echo "run-mac=true"   >> $GITHUB_OUTPUT || echo "run-mac=false"   >> $GITHUB_OUTPUT
          fi

  build-linux:
    needs: parse-platforms
    if: needs.parse-platforms.outputs.run-linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Linux
        run: yarn run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm

  build-win:
    needs: parse-platforms
    if: needs.parse-platforms.outputs.run-win == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows
        run: yarn run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: dist-electron/*.exe

  build-mac:
    needs: parse-platforms
    if: needs.parse-platforms.outputs.run-mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build macOS
        run: yarn run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
